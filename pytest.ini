[pytest]
testpaths = backend/tests
python_files = test_*.py
# `slow` marks tests that load a real model. They are excluded by default so the
# suite stays fast enough to run on every change; run them with `-m slow` after
# touching separation or the classifiers.
addopts = -q -m "not slow"
markers =
    slow: loads a real model (seconds to minutes)
